# Copy .env.example to .env and fill in your PostgreSQL credentials.
# Start: docker compose up --build -d
services:
  library-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: ${DB_URL:?Set DB_URL in .env}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${DB_DDL_AUTO:-update}
      SPRING_JPA_SHOW_SQL: "false"
    restart: unless-stopped
